<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alarm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f0f1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    .card {
      background: #1a1a2e;
      border-radius: 24px;
      padding: 48px 56px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
      width: 340px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    }

    h1 {
      font-size: 15px;
      font-weight: 500;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #888;
    }

    .clock {
      font-size: 64px;
      font-weight: 200;
      letter-spacing: 0.05em;
      color: #eee;
      font-variant-numeric: tabular-nums;
    }

    .time-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .time-input input {
      width: 80px;
      background: #252540;
      border: none;
      border-radius: 12px;
      color: #fff;
      font-size: 28px;
      font-weight: 300;
      text-align: center;
      padding: 12px 8px;
      outline: none;
      font-variant-numeric: tabular-nums;
      -moz-appearance: textfield;
    }

    .time-input input::-webkit-outer-spin-button,
    .time-input input::-webkit-inner-spin-button { -webkit-appearance: none; }

    .time-input input:focus {
      background: #2e2e50;
    }

    .time-input span {
      font-size: 28px;
      font-weight: 200;
      color: #555;
    }

    .status {
      font-size: 14px;
      color: #555;
      height: 20px;
      letter-spacing: 0.05em;
      transition: color 0.3s;
    }

    .status.active { color: #6c8fff; }
    .status.ringing { color: #ff6b6b; }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      letter-spacing: 0.05em;
      transition: all 0.2s;
    }

    #btn-set {
      background: #6c8fff;
      color: #fff;
    }

    #btn-set:hover { background: #7e9dff; }

    #btn-stop {
      background: #ff6b6b;
      color: #fff;
      display: none;
    }

    #btn-stop:hover { background: #ff8080; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    body.ringing .clock {
      animation: pulse 1s ease-in-out infinite;
      color: #ff6b6b;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>Alarm</h1>

  <div class="clock" id="clock">00:00:00</div>

  <div class="time-input">
    <input type="number" id="hour" min="0" max="23" placeholder="HH" maxlength="2">
    <span>:</span>
    <input type="number" id="minute" min="0" max="59" placeholder="MM" maxlength="2">
  </div>

  <div class="status" id="status">アラームを設定してください</div>

  <button id="btn-set" onclick="setAlarm()">Set Alarm</button>
  <button id="btn-stop" onclick="stopAlarm()">Stop</button>
</div>

<script>
  let alarmTime = null;
  let audioCtx = null;
  let alarmInterval = null;
  let ringing = false;
  let noiseNode = null;

  function pad(n) { return String(n).padStart(2, '0'); }

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent =
      `${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;

    if (alarmTime && !ringing) {
      const h = now.getHours(), m = now.getMinutes(), s = now.getSeconds();
      if (h === alarmTime.h && m === alarmTime.m && s === 0) {
        triggerAlarm();
      }
    }
  }

  function setAlarm() {
    const h = parseInt(document.getElementById('hour').value);
    const m = parseInt(document.getElementById('minute').value);

    if (isNaN(h) || isNaN(m) || h < 0 || h > 23 || m < 0 || m > 59) {
      setStatus('時間を正しく入力してください', '');
      return;
    }

    alarmTime = { h, m };
    document.getElementById('btn-set').style.display = 'none';
    document.getElementById('btn-stop').style.display = 'block';
    document.getElementById('btn-stop').textContent = 'Cancel';
    setStatus(`${pad(h)}:${pad(m)} にアラームをセット`, 'active');

    if (Notification.permission === 'default') Notification.requestPermission();
  }

  function stopAlarm() {
    alarmTime = null;
    ringing = false;
    document.body.classList.remove('ringing');
    if (noiseNode) { noiseNode.stop(); noiseNode = null; }
    document.getElementById('btn-set').style.display = 'block';
    document.getElementById('btn-stop').style.display = 'none';
    setStatus('アラームを設定してください', '');
  }

  function triggerAlarm() {
    ringing = true;
    document.body.classList.add('ringing');
    setStatus('アラーム！', 'ringing');
    document.getElementById('btn-stop').textContent = 'Stop';
    playBeep();
    if (Notification.permission === 'granted') {
      new Notification('Alarm', { body: 'Time is up!' });
    }
  }

  function playBeep() {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function beep() {
      if (!ringing) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.frequency.value = 880;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.6);
      osc.start(audioCtx.currentTime);
      osc.stop(audioCtx.currentTime + 0.6);
      setTimeout(() => { if (ringing) beep(); }, 1000);
    }

    beep();
  }

  function setStatus(text, cls) {
    const el = document.getElementById('status');
    el.textContent = text;
    el.className = 'status' + (cls ? ' ' + cls : '');
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>

</body>
</html>
